name: Backend tests

on:
  push:
    paths:
      - "backend/**"
      - "package.json"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "package.json"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: forgeflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: forgeflow
      JWT_SECRET: test-only-secret-that-is-at-least-32-characters-long
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend workspace dependencies
        run: npm install --workspace backend --include-workspace-root=false
      - name: Create database schema
        run: mysql -h 127.0.0.1 -uroot -proot < backend/database/schema.sql
      - name: Apply additive database indexes
        run: mysql -h 127.0.0.1 -uroot -proot < backend/database/002_query_indexes.sql
      - name: Seed curated ideas
        run: mysql -h 127.0.0.1 -uroot -proot forgeflow < backend/database/seed.sql
      - name: Run backend tests
        run: npm test
