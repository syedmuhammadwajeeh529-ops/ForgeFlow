name: ForgeFlow CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check backend JavaScript syntax
        run: find backend/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run backend tests
        run: npm test --workspace backend
      - name: Build frontend
        run: npm run build --workspace frontend
