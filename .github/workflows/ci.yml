name: ForgeFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: forgeflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      RUN_DB_INTEGRATION_TESTS: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: forgeflow
      JWT_SECRET: forgeflow-ci-test-secret-that-is-long-enough-for-hmac
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check backend JavaScript syntax
        run: find backend/src backend/test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run backend unit and MySQL integration tests
        run: npm test --workspace backend
      - name: Build frontend
        run: npm run build --workspace frontend
